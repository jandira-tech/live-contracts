[project]
name = "sec-listener"
version = "0.2.0"
description = "Continuous RSS listener for SEC filings with EX-10 exhibit extraction, markdown conversion, and internal API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp",
    "datamule",
    "markitdown",
    "fastapi",
    "uvicorn[standard]",
    # Parallel HF dataset sink (parquet snapshot of ex10_exhibits). Optional at
    # runtime — sync no-ops without HF_TOKEN, so SQLite stays the plan-B store.
    "huggingface_hub",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[project.scripts]
sec-listener = "sec_listener.listener:main"
sec-listener-api = "sec_listener.api:main"
sec-listener-worker = "sec_listener.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/sec_listener"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.uv]
package = true
